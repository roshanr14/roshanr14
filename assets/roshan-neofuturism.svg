<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="100%" height="120" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&amp;display=swap');

      .nf-title {
        font-family: 'Orbitron', -apple-system, sans-serif;
        font-weight: 900;
        font-size: 78px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      .nf-glow-cyan {
        filter: drop-shadow(0 0 16px rgba(0, 240, 255, 0.8)) drop-shadow(0 0 35px rgba(0, 240, 255, 0.45));
      }
      .nf-glow-purple {
        filter: drop-shadow(0 0 16px rgba(168, 85, 247, 0.85)) drop-shadow(0 0 40px rgba(168, 85, 247, 0.5));
      }
      .nf-pulse {
        animation: neonPulse 3s ease-in-out infinite alternate;
      }
      @keyframes neonPulse {
        0% {
          filter: drop-shadow(0 0 12px rgba(0, 240, 255, 0.7)) drop-shadow(0 0 25px rgba(168, 85, 247, 0.5));
        }
        50% {
          filter: drop-shadow(0 0 22px rgba(192, 132, 252, 0.9)) drop-shadow(0 0 50px rgba(0, 240, 255, 0.7));
        }
        100% {
          filter: drop-shadow(0 0 12px rgba(0, 240, 255, 0.7)) drop-shadow(0 0 25px rgba(168, 85, 247, 0.5));
        }
      }
    </style>

    <!-- Holographic Chrome Gradient -->
    <linearGradient id="nf-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="20%" stop-color="#E0F2FE" />
      <stop offset="45%" stop-color="#00F0FF" />
      <stop offset="75%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>

    <!-- Outer Neon Stroke Gradient -->
    <linearGradient id="nf-stroke-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
  </defs>

  <!-- Pure Neo-Futurism ROSHAN Typography -->
  <g transform="translate(400, 88)" class="nf-pulse">
    <!-- Deep Neon Ambient Glow Layer -->
    <text x="0" y="0" text-anchor="middle" class="nf-title nf-glow-cyan" stroke="rgba(0, 240, 255, 0.7)" stroke-width="8" stroke-linejoin="round" fill="none">ROSHAN</text>
    
    <!-- Cyber Purple Secondary Glow Layer -->
    <text x="0" y="0" text-anchor="middle" class="nf-title nf-glow-purple" stroke="rgba(168, 85, 247, 0.8)" stroke-width="4" stroke-linejoin="round" fill="none">ROSHAN</text>
    
    <!-- Sharp Futuristic Outline -->
    <text x="0" y="0" text-anchor="middle" class="nf-title" stroke="url(#nf-stroke-grad)" stroke-width="2" stroke-linejoin="round" fill="none">ROSHAN</text>
    
    <!-- Main Metallic Holographic Fill -->
    <text x="0" y="0" text-anchor="middle" class="nf-title" fill="url(#nf-text-grad)">ROSHAN</text>
  </g>
</svg>
